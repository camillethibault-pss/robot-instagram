<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎛️ Panneau Robot Instagram</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; background: #f5f6f8; color: #222; }
h1 { font-size: 28px; }
h2 { font-size: 22px; margin-top: 30px; }
.card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
input, textarea, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
textarea { resize: vertical; min-height: 80px; }
button { background: #0095f6; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 16px; }
button:hover { background: #0080d6; }
button.danger { background: #e74c3c; padding: 6px 12px; font-size: 12px; margin-top: 0; }
button.danger:hover { background: #c0392b; }
.rule { background: #fafafa; border-left: 4px solid #0095f6; padding: 14px; margin-bottom: 10px; border-radius: 6px; }
.rule strong { color: #0095f6; }
.tag { display: inline-block; background: #e8f3ff; color: #0095f6; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 4px; margin-top: 4px; }
.tag.green { background: #e8f9ee; color: #1e8e3e; }
.tag.orange { background: #fff4e5; color: #d77a00; }
.field-group { display: none; }
.field-group.active { display: block; }
small { color: #777; font-size: 12px; }
.counter { color: #999; font-size: 12px; margin-top: 4px; }
hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
.empty { color: #888; font-style: italic; }
</style>
</head>
<body>

<h1>🎛️ Mes règles automatiques</h1>

<div class="card">
  <h2>➕ Ajouter une règle</h2>

  <label>Mot(s)-clé(s) déclencheur(s) — séparés par des virgules</label>
  <input id="keywords" type="text" placeholder="ex: prix, tarif, combien">

  <label>Type de message DM</label>
  <select id="type">
    <option value="text">📝 Texte simple</option>
    <option value="image">🖼️ Image seule</option>
    <option value="button">🔘 Texte + Bouton CTA</option>
    <option value="image_button">🎴 Image + Titre + Bouton CTA</option>
  </select>

  <div class="field-group active" data-types="text,button,image_button">
    <label>Message / Titre</label>
    <textarea id="dmText" placeholder="Coucou ! Voici le lien : https://..."></textarea>
  </div>

  <div class="field-group" data-types="image,image_button">
    <label>URL de l'image (HTTPS, JPG/PNG/GIF)</label>
    <input id="imageUrl" type="url" placeholder="https://i.postimg.cc/...">
    <small>⚠️ WebP non supporté. HTTPS obligatoire. Max 8 Mo.</small>
  </div>

  <div class="field-group" data-types="button,image_button">
    <label>Texte du bouton CTA (max 20 caractères)</label>
    <input id="ctaText" type="text" maxlength="20" placeholder="ex: Voir l'offre">
    <div class="counter" id="ctaCounter">0 / 20</div>

    <label>URL du bouton CTA</label>
    <input id="ctaUrl" type="url" placeholder="https://www.privatesportshop.com/...">
  </div>

  <hr>

  <label>Réponse publique (optionnel) — sépare les variantes par <code>|</code> ou retour à la ligne</label>
  <textarea id="publicReply" placeholder="Check tes DM 💌 | Regarde tes messages | Je t'ai écrit en privé"></textarea>
  <div class="counter" id="variantCounter">0 variante</div>

  <button onclick="addRule()">+ Ajouter la règle</button>
</div>

<h2>📋 Règles actives</h2>
<div id="rules"><p class="empty">Chargement...</p></div>

<script>
// Switch type fields
const typeSelect = document.getElementById('type');
function refreshFields() {
  const type = typeSelect.value;
  document.querySelectorAll('.field-group').forEach(g => {
    const types = g.dataset.types.split(',');
    g.classList.toggle('active', types.includes(type));
  });
}
typeSelect.addEventListener('change', refreshFields);
refreshFields();

// CTA counter
const ctaText = document.getElementById('ctaText');
ctaText.addEventListener('input', () => {
  document.getElementById('ctaCounter').textContent = ctaText.value.length + ' / 20';
});

// Variant counter
const publicReply = document.getElementById('publicReply');
publicReply.addEventListener('input', () => {
  const variants = publicReply.value.split(/\||\n/).map(s => s.trim()).filter(Boolean);
  document.getElementById('variantCounter').textContent = variants.length + ' variante' + (variants.length > 1 ? 's' : '');
});

// Load rules
async function loadRules() {
  try {
    const res = await fetch('/api/rules');
    const rules = await res.json();
    const container = document.getElementById('rules');
    if (!rules.length) {
      container.innerHTML = '<p class="empty">Aucune règle pour l\'instant.</p>';
      return;
    }
    container.innerHTML = rules.map(r => {
      const typeLabel = {
        text: '📝 Texte',
        image: '🖼️ Image',
        button: '🔘 Texte + CTA',
        image_button: '🎴 Image + CTA'
      }[r.type || 'text'];
      const variants = (r.publicReply || '').split(/\||\n/).map(s => s.trim()).filter(Boolean);
      return `
        <div class="rule">
          <div><span class="tag orange">${typeLabel}</span><strong>${escapeHtml(r.keywords || '')}</strong></div>
          ${r.dmText ? `<div style="margin-top:6px"><small>Message:</small> ${escapeHtml(r.dmText)}</div>` : ''}
          ${r.imageUrl ? `<div style="margin-top:6px"><small>Image:</small> <a href="${escapeHtml(r.imageUrl)}" target="_blank">${escapeHtml(r.imageUrl)}</a></div>` : ''}
          ${r.ctaText ? `<div style="margin-top:6px"><small>Bouton:</small> "${escapeHtml(r.ctaText)}" → <a href="${escapeHtml(r.ctaUrl)}" target="_blank">${escapeHtml(r.ctaUrl)}</a></div>` : ''}
          ${variants.length ? `<div style="margin-top:6px"><small>Réponses publiques (${variants.length}):</small> ${variants.map(v => `<span class="tag green">${escapeHtml(v)}</span>`).join(' ')}</div>` : ''}
          <button class="danger" onclick="deleteRule('${r.id}')">🗑️ Supprimer</button>
        </div>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('rules').innerHTML = '<p class="empty">Erreur de chargement : ' + e.message + '</p>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function addRule() {
  const type = typeSelect.value;
  const rule = {
    type,
    keywords: document.getElementById('keywords').value.trim(),
    dmText: document.getElementById('dmText').value.trim(),
    imageUrl: document.getElementById('imageUrl').value.trim(),
    ctaText: document.getElementById('ctaText').value.trim(),
    ctaUrl: document.getElementById('ctaUrl').value.trim(),
    publicReply: document.getElementById('publicReply').value.trim()
  };

  if (!rule.keywords) { alert('Mot-clé obligatoire'); return; }
  if ((type === 'text' || type === 'button' || type === 'image_button') && !rule.dmText) { alert('Message/Titre obligatoire'); return; }
  if ((type === 'image' || type === 'image_button') && !rule.imageUrl) { alert('URL d\'image obligatoire'); return; }
  if ((type === 'button' || type === 'image_button') && (!rule.ctaText || !rule.ctaUrl)) { alert('Texte + URL du bouton obligatoires'); return; }

  await fetch('/api/rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(rule)
  });

  // Reset
  document.getElementById('keywords').value = '';
  document.getElementById('dmText').value = '';
  document.getElementById('imageUrl').value = '';
  document.getElementById('ctaText').value = '';
  document.getElementById('ctaUrl').value = '';
  document.getElementById('publicReply').value = '';
  document.getElementById('ctaCounter').textContent = '0 / 20';
  document.getElementById('variantCounter').textContent = '0 variante';

  loadRules();
}

async function deleteRule(id) {
  if (!confirm('Supprimer cette règle ?')) return;
  await fetch('/api/rules/' + id, { method: 'DELETE' });
  loadRules();
}

loadRules();
</script>

</body>
</html>
